<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | MetaCash</title>


    <!-- =====================================
            FONTE
    ====================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
            CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="../css/paginas/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/paginas/dashboard.css"
    >

</head>


<body>


    <!-- =====================================
            SIDEBAR
    ====================================== -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="sidebar-logo">

            <img
                src="../assets/icons/imagens/logo/abacate.png"
                alt="MetaCash"
            >

        </div>


        <!-- =================================
                MENU
        ================================== -->

        <nav class="menu">


            <!-- DASHBOARD -->

            <a
                href="dashboard.html"
                class="menu-item active"
            >

                <span>⌂</span>

                Dashboard

            </a>


            <!-- ENTRADAS -->

            <a
                href="entradas.html"
                class="menu-item"
            >

                <span>＋</span>

                Entradas

            </a>


            <!-- GASTOS -->

            <a
                href="gastos.html"
                class="menu-item"
            >

                <span>−</span>

                Gastos

            </a>


            <!-- METAS -->

            <a
                href="metas.html"
                class="menu-item"
            >

                <span>🎯</span>

                Metas

            </a>


            <!-- RELATÓRIOS -->

            <a
                href="relatorios.html"
                class="menu-item"
            >

                <span>▣</span>

                Relatórios

            </a>


            <!-- CONFIGURAÇÕES -->

            <a
                href="configuração.html"
                class="menu-item"
            >

                <span>⚙</span>

                Configurações

            </a>


        </nav>


        <!-- =================================
                SAIR
        ================================== -->

        <div class="sidebar-bottom">

            <button id="sair">

                ↪ Sair

            </button>

        </div>


    </aside>



    <!-- =====================================
            DASHBOARD
    ====================================== -->

    <main class="dashboard">


        <!-- =================================
                CABEÇALHO
        ================================== -->

        <div class="dashboard-header">


            <div class="welcome">

                <h1 id="saudacao">

                    Olá!

                </h1>


                <p id="nomeUsuario">

                    Usuário

                </p>

            </div>


            <div
                class="avatar"
                id="avatar"
            >

                U

            </div>


        </div>



        <!-- =================================
                CARDS
        ================================== -->

        <div class="cards-container">


            <!-- SALDO -->

            <div class="card saldo">

                <h3>

                    Saldo Atual

                </h3>


                <p id="saldoAtual">

                    R$ 0,00

                </p>

            </div>


            <!-- ENTRADAS -->

            <div class="card entradas">

                <h3>

                    Total de Entradas

                </h3>


                <p id="totalEntradas">

                    R$ 0,00

                </p>

            </div>


            <!-- GASTOS -->

            <div class="card gastos">

                <h3>

                    Total de Gastos

                </h3>


                <p id="totalGastos">

                    R$ 0,00

                </p>

            </div>


        </div>



        <!-- =================================
                ALERTAS FINANCEIROS
        ================================== -->

        <section
            id="alertasFinanceiros"
            class="alertas-financeiros"
        ></section>



        <!-- =================================
                CATEGORIAS
        ================================== -->

        <section class="categories-section">


            <h2>

                Suas Categorias

            </h2>


            <div
                id="categoriasLista"
                class="categories-list"
            ></div>


        </section>



        <!-- =================================
                ÚLTIMAS MOVIMENTAÇÕES
        ================================== -->

        <section class="movements-section">


            <div class="section-header">

                <h2>

                    Últimas movimentações

                </h2>

            </div>


            <div
                id="movimentacoesLista"
                class="movements-list"
            ></div>


        </section>


    </main>



    <!-- =====================================
            JAVASCRIPT
    ====================================== -->

    <script src="../js/storage.js"></script>

    <script src="../js/dashboard.js"></script>


</body>

</html>Q
